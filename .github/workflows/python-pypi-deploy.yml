name: Python PyPI Deploy

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version for building"
        type: string
        required: false
        default: "3.12"
      environment:
        description: "GitHub environment for the deploy job (must match PyPI trusted publisher config)"
        type: string
        required: false
        default: "production"

    outputs:
      released:
        description: "'true' if a new version was released"
        value: ${{ jobs.release.outputs.released }}
      version:
        description: "The released version string (e.g. 1.3.0)"
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: "The git tag created (e.g. v1.3.0)"
        value: ${{ jobs.release.outputs.tag }}

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Force release branch to be at workflow sha
        run: git reset --hard ${{ github.sha }}

      - uses: thekhoo/github-actions-shared/.github/actions/python-semantic-release@main
        id: release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          python-version: ${{ inputs.python-version }}

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v7.0.1
        if: steps.release.outputs.released == 'true'
        with:
          name: distribution-artifacts
          path: dist
          if-no-files-found: error

    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

  deploy:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    environment: ${{ inputs.environment }}
    if: ${{ needs.release.outputs.released == 'true' }}
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Download Distribution Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: distribution-artifacts
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to GitHub Release
        uses: python-semantic-release/publish-action@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.release.outputs.tag }}
