# ============================================================================
# Composite action — Python PyPI Publish
#
# Builds a ref (usually a release tag) and publishes it to a Python package
# index with trusted publishing (OIDC). It does not calculate versions or tag
# anything. Use it after github-tag-release (release-please) has created the
# release.
#
# This is an action, not a reusable workflow, on purpose: PyPI trusted
# publishing does not accept a reusable workflow in another repository. A
# composite action runs inside the caller's job, so the trusted publisher
# names the caller's own workflow file.
#
# Usage (in a workflow that runs on `release: published`):
#
#   jobs:
#     publish:
#       runs-on: ubuntu-latest
#       environment: production
#       permissions:
#         contents: read
#         id-token: write
#       steps:
#         - uses: thekhoo/github-actions-shared/.github/actions/python-pypi-publish@main
#           with:
#             ref: ${{ github.event.release.tag_name }}
#
# For TestPyPI, set `environment: testpypi` on the job and add:
#             repository-url: https://test.pypi.org/legacy/
#             check-url: https://test.pypi.org/simple/
# ============================================================================
name: "Python PyPI Publish"
description: >
  Build a ref and publish it to PyPI (or another index) with trusted publishing.

branding:
  icon: "upload-cloud"
  color: "blue"

inputs:
  ref:
    description: "Git ref to build and publish (for example the release tag v1.3.0)"
    required: true
  repository-url:
    description: "Upload URL of the package index. Use https://test.pypi.org/legacy/ for TestPyPI"
    required: false
    default: "https://upload.pypi.org/legacy/"
  build-command:
    description: "Command that builds the distributions into packages-dir"
    required: false
    default: "uv build"
  packages-dir:
    description: "Directory that holds the built distributions"
    required: false
    default: "dist"
  check-url:
    description: "Index URL to check for files that already exist, so they are skipped instead of failing (for example https://test.pypi.org/simple/ for TestPyPI). Empty means no check"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - uses: astral-sh/setup-uv@v5

    - name: Build
      shell: bash
      run: ${{ inputs.build-command }}

    # uv publish, not pypa/gh-action-pypi-publish: that action cannot run nested inside another
    # action (it resolves its container image from the outermost action's repository).
    - name: Publish
      shell: bash
      env:
        PUBLISH_URL: ${{ inputs.repository-url }}
        CHECK_URL: ${{ inputs.check-url }}
        PACKAGES_DIR: ${{ inputs.packages-dir }}
      run: |
        args=(--trusted-publishing always --publish-url "$PUBLISH_URL")
        if [[ -n "$CHECK_URL" ]]; then
          args+=(--check-url "$CHECK_URL")
        fi
        uv publish "${args[@]}" "$PACKAGES_DIR"/*
