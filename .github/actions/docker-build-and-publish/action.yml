name: Build and Publish Docker Image
description: Build and publish a Docker image to a registry.

inputs:
  registry:
    description: 'Docker registry to publish to (e.g., docker.io, ghcr.io)'
    required: true

  username:
    description: 'Username for the Docker registry (pass via secrets)'
    required: true

  password:
    description: 'Password or token for the Docker registry (pass via secrets)'
    required: true

  image-name:
    description: 'Image name without registry or tags (e.g., myuser/myapp)'
    required: true

  commit-sha:
    description: 'Git commit SHA to use as image tag'
    required: true

  dockerfile-path:
    description: 'Path to the Dockerfile'
    required: false
    default: './Dockerfile'

  build-context:
    description: 'Build context directory'
    required: false
    default: '.'

  platforms:
    description: 'Comma-separated list of platforms (e.g., linux/amd64,linux/arm64)'
    required: false
    default: 'linux/amd64'

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Build image tag with commit SHA
      id: tag
      shell: bash
      run: |
        IMAGE_TAG="${{ inputs.registry }}/${{ inputs.image-name }}:sha-${{ inputs.commit-sha }}"
        echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.build-context }}
        file: ${{ inputs.dockerfile-path }}
        push: true
        tags: ${{ steps.tag.outputs.image-tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: ${{ inputs.platforms }}

outputs:
  image-tag:
    description: 'Full image tag that was built and pushed (registry/name:sha-xxx)'
    value: ${{ steps.tag.outputs.image-tag }}

