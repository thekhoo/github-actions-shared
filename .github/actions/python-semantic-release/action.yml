# ============================================================================
# Composite action — Python Semantic Release
#
# Handles: version bump, commit, tag.
# Does NOT handle PyPI publishing or GitHub Release creation — those
# must stay in the caller's workflow. Use the companion action
# github-publish-release to create the GitHub Release after PyPI succeeds.
#
# Runs semantic-release via pip instead of the upstream Docker action to
# allow pinning gitpython (see issue python-semantic-release#1476).
#
# Usage:
#
#   - uses: thekhoo/github-actions-shared/.github/actions/python-semantic-release@main
#     id: release
#     with:
#       github-token: ${{ secrets.GITHUB_TOKEN }}
#
#   # publish to PyPI here ...
#
#   - uses: thekhoo/github-actions-shared/.github/actions/github-publish-release@main
#     if: steps.release.outputs.released == 'true'
#     with:
#       github-token: ${{ secrets.GITHUB_TOKEN }}
#       tag: ${{ steps.release.outputs.tag }}
# ============================================================================
name: "Python Semantic Release"
description: >
  Analyse conventional commits, bump version in pyproject.toml,
  and create a git tag.

branding:
  icon: "package"
  color: "green"

inputs:
  github-token:
    description: "GitHub token with contents: write permission"
    required: true
  python-version:
    description: "Python version for building"
    required: false
    default: "3.12"
  git-committer-name:
    description: "Name for the version bump commit"
    required: false
    default: "github-actions[bot]"
  git-committer-email:
    description: "Email for the version bump commit"
    required: false
    default: "github-actions[bot]@users.noreply.github.com"

outputs:
  released:
    description: "'true' if a new version was released"
    value: ${{ steps.semrel.outputs.released }}
  version:
    description: "The released version string (e.g. 1.3.0)"
    value: ${{ steps.semrel.outputs.version }}
  tag:
    description: "The git tag created (e.g. v1.3.0)"
    value: ${{ steps.semrel.outputs.tag }}

runs:
  using: "composite"
  steps:
    - name: Ensure full git history
      shell: bash
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "Unshallowing repository..."
          git fetch --unshallow --tags
        else
          git fetch --tags
        fi

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install semantic-release
      shell: bash
      run: |
        pip install "python-semantic-release==10.6.1" "gitpython>=3.1,<3.1.60"

    - name: Configure git
      shell: bash
      run: |
        git config user.name "${{ inputs.git-committer-name }}"
        git config user.email "${{ inputs.git-committer-email }}"

    - name: Semantic Release
      id: semrel
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        semantic-release -v version
